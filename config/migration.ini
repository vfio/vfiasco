; migration.ini — Live migration configuration
;
; Required by all live migration tests:
;   case_live_migrate_no_device (basic virtio-only migration — tgt_nic_name not needed)
;   case_live_migrate_with_failover_vf
;   case_cancel_live_migrate_with_failover_vf
;   case_cancel_and_live_migrate_with_failover_vf
;   case_live_migrate_with_two_failover_vfs_one_pf
;   case_live_migrate_with_two_failover_vfs_two_pfs
;   case_live_migrate_after_hotunplug_failover_vf
;   case_live_migrate_with_device
;   case_cancel_live_migrate_with_device
;   case_cancel_and_live_migrate_with_device
;   case_live_migrate_after_hotplug_and_hotunplug_device
;
; [migration_test]
;   migrate_source_hostname   Hostname of the source (current) host.
;   migrate_source_host_ip    Management IP of the source host.
;   migrate_source_test_ip    Data-plane IP of the source host (used to verify connectivity).
;   migrate_source_user       SSH username on the source host.
;   migrate_source_pwd        SSH password on the source host.
;
;   migrate_dest_hostname     Hostname of the migration destination host.
;   migrate_dest_host_ip      Management IP of the destination host.
;   migrate_dest_test_ip      Data-plane IP of the destination host.
;   migrate_dest_user         SSH username on the destination host.
;   migrate_dest_pwd          SSH password on the destination host.
;
;   NFS shared storage — two modes:
;
;     Dedicated NFS server (recommended):
;       Set nfs_server_ip to an external server (e.g. the hypervisor).
;       Both hosts only mount from that server; the export_* fields are
;       ignored and no /etc/exports or nfs-server.service changes are made.
;
;       nfs_server_ip         IP of the NFS server.  When set to an address that differs
;                             from both source and destination, dedicated-server mode is used.
;                             Defaults to migrate_source_host_ip when omitted.
;       nfs_mount_src         Path exported by the NFS server (path only; nfs_server_ip is
;                             prepended automatically by host.mount()).  e.g. /srv/migration
;       nfs_mount_dir         Mount point on both hosts for the shared VM disk.
;
;     Peer-to-peer (legacy):
;       Omit nfs_server_ip (defaults to migrate_source_host_ip).
;       Both hosts export the share via /etc/exports and run nfs-server.
;       Avoid this mode — it creates a loopback mount on the source.
;
;       export_dir            Directory exported via NFS (peer-to-peer mode only).
;       export_options        NFS export options, e.g. rw,no_root_squash (peer-to-peer only).
;       export_ip             IP/subnet allowed to mount the NFS share (peer-to-peer only).
;
;   Failover VF tests only:
;
;   tgt_nic_name              Device name (from host_devices.ini) of the NIC on the destination host
;                             used for failover VF creation.

[migration_test]
migrate_source_hostname = vm06
migrate_source_host_ip  = 192.168.199.6
migrate_source_test_ip  = 192.168.199.6
migrate_source_user     = root
migrate_source_pwd      = passw0rd

migrate_dest_hostname = vm07
migrate_dest_host_ip  = 192.168.199.7
migrate_dest_test_ip  = 192.168.199.7
migrate_dest_user     = root
migrate_dest_pwd      = passw0rd

; Dedicated NFS server
nfs_server_ip = 192.168.199.1
nfs_mount_src = /srv/migration
nfs_mount_dir = /srv/migration

; iperf3 workload migration test
;   iperf_host_ip     IP of the machine running the iperf3 client (must be on the
;                     same L2 network as the passthrough NIC).  Defaults to nfs_server_ip.
;   iperf_guest_ip    Static IP assigned to the passthrough VF inside the guest
;                     for iperf3 traffic.  Must be on the same subnet as iperf_host_ip.
iperf_host_ip  = 192.168.199.1
iperf_guest_ip = 192.168.199.200

; Peer-to-peer
; export_dir     = /srv/migration
; export_options = rw,no_root_squash
; export_ip      = 192.168.199.0/24
