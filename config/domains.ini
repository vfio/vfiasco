; domains.ini — Guest VM configuration
;
; [domain]  Default parameters inherited by every named domain section.
;   memory           RAM in MiB.
;   vcpu             Number of virtual CPUs.
;   image_size       Disk image size in GB (used when creating a new image).
;   display_type     Guest display type: vnc | spice.
;   display_port     VNC/SPICE port number.
;   user             Username for SSH login into the guest.
;   passwd           Password for SSH login into the guest.
;   1g_hugepage_number          Number of 1G hugepages to allocate for hugepage tests.
;   2m_hugepage_number          Number of 2M hugepages to allocate for hugepage tests.
;   minimum_1g_hugepage_number  Minimum 1G hugepages required to run hugepage tests.
;   minimum_2m_hugepage_number  Minimum 2M hugepages required to run hugepage tests.
;
; [<domain-name>]  Domain-specific overrides merged into [domain] at runtime.
;   name         libvirt domain name (must match --domain argument).
;   mac_addr     MAC address of the guest management NIC (used for DHCP lease lookup).
;   image_name   Filename of the guest disk image (with .qcow2 extension).
;   distro       Cloud image distro key (must match an entry in DISTRO_CONFIG in
;                utils/setup_domain.py). Defaults to the section name if omitted.
;   platform     (optional) Platform variant for domain setup and runtime behaviour.
;                  grace — aarch64 + SMMUv3 (GraceHopper); setup_domain.py generates
;                          the domain XML via virsh define instead of virt-install, and
;                          iommufd is enabled automatically at runtime.
;   secure_boot  (optional) Enable UEFI Secure Boot. Default: no.
;                Set to yes for guests with signed bootloaders (e.g. RHEL).
;   install_tree      (optional) URL of an OS installation tree; triggers virt-install
;                     kickstart path instead of the cloud image path when present.
;   unattended_file   Kickstart or unattended answer file name inside unattended_dir.
;                     Required when install_tree is set (Linux) or for Windows installs.
;
;   Windows-only installation keys (ignored for Linux guests):
;   cdrom_install     Windows install ISO filename (mounted at nfs.iso_dst).
;   cdrom_virtio      VirtIO driver ISO filename.
;   cdrom_unattended  Unattended/autounattend ISO filename.

[domain]
; Default parameters inherited by all domain sections via update_dict().
memory = 2048
vcpu = 2
image_size = 10
display_type = vnc
display_port = 5900
user = root
passwd = passw0rd
1g_hugepage_number = 0
2m_hugepage_number = 0
minimum_1g_hugepage_number = 0
minimum_2m_hugepage_number = 0

[centos10]
name = centos10
mac_addr = c0:ff:ee:00:00:50
image_name = centos10.qcow2

[centos10_1]
name = centos10_1
mac_addr = c0:ff:ee:00:00:52
image_name = centos10_1.qcow2
distro = centos10

[centos10_large]
name = centos10_large
mac_addr = c0:ff:ee:00:00:53
image_name = centos10_large.qcow2
distro = centos10
memory = 32768
; NOTE (alder / a10_gpu): set <video><model type='none'/></video> in the
; domain XML — the A10's 32 GB BAR conflicts with the emulated video device's
; 64-bit BAR in the guest PCI window.

[rhel10]
name = rhel10
mac_addr = c0:ff:ee:00:00:51
image_name = rhel10.qcow2

[rhel10_1]
name = rhel10_1
mac_addr = c0:ff:ee:00:00:55
image_name = rhel10_1.qcow2
distro = rhel10

[rhel9]
name = rhel9
mac_addr = c0:ff:ee:00:00:56
image_name = rhel9.qcow2

; GraceHopper aarch64 domain — H100 GPU passthrough via nvgrace_gpu_vfio_pci.
; 16 GB memory + hugepages required by SMMUv3 cmdqv.
; 16 vCPUs matches the run-arm64-gh.sh default.
; Use: --feature pf --machine_type virt --domain centos10_gh
; (--iommufd is enabled automatically for platform=grace)
[centos10_gh]
name                        = centos10_gh
mac_addr                    = c0:ff:ee:00:00:54
image_name                  = centos10_gh.qcow2
distro                      = centos10
platform                    = grace
memory                      = 16384
vcpu                        = 16
1g_hugepage_number          = 20
minimum_1g_hugepage_number  = 16

; GraceHopper aarch64 domain — RHEL 10 variant.
; Use: --feature vgpu --machine_type virt --domain rhel10_gh_vgpu --device_name gh100_gpu
[rhel10_gh_vgpu]
name                        = rhel10_gh_vgpu
mac_addr                    = c0:ff:ee:00:00:58
image_name                  = rhel10_gh_vgpu.qcow2
distro                      = rhel10
platform                    = grace_vgpu
memory                      = 8192
vcpu                        = 36
1g_hugepage_number          = 20
minimum_1g_hugepage_number  = 16

