; host_devices.ini — Physical device registry (shared example)
;
; One section per device. The section name is used as --device_name.
; Most device properties (max_vfs, exclusive_iommu, patterns, etc.) are
; computed from sysfs at startup.  Required fields:
;
;   device_addr    PCI address of the PF          (lspci -D | grep -i ethernet)
;
; Optional fields:
;   device_driver         Kernel driver the PF must be bound to for VF creation
;   test_ip_addr          IP to ping from inside guest   (empty = skip network check)
;   vf_trust_enforced     NIC enforces VF trust mode (yes/no, default: no)
;   aer_inject_supported  VF supports aer-inject (yes/no, default: no)
;   switchdev_mode        Sets up switchdev mode for the corresponding VF (yes/no, default: no)
;   vgpu_type             NVIDIA vGPU type ID for SR-IOV vGPU (--feature=vgpu only)
;
; If a file domain_xml/<device_name>.xml exists it is used as the hostdev
; injection template instead of the generic pf.xml / vf.xml.  Use this for
; devices that need a non-standard PCI address, ACPI nodeset, or other
; hostdev attributes (e.g. domain_xml/gh100_gpu.xml for GraceHopper).
;
; Per-host override: place a host-specific copy of this file under
; config/hosts/<hostname>/host_devices.ini to override this file entirely.
; The hostname is detected via socket.gethostname(); when the hostname is
; an FQDN, the short name is checked first (e.g. config/hosts/alder/)
; then the full name. See README.md for details.

[igb_nic]
device_addr   = 0000:08:00.0
device_driver = igb
test_ip_addr  = 192.168.200.1

[dual_igb_nic]
device_addr   = 0000:08:00.0,0000:0b:00.0
device_driver = igb
test_ip_addr  = 192.168.200.1

[a10_gpu]
device_addr   = 0000:02:00.0

[ixgbe_nic]
device_addr   = 0000:01:00.0
device_driver = ixgbe
test_ip_addr  = 192.168.124.31

[cx6_nic]
device_addr   = 0001:01:00.1
device_driver = mlx5_core
vf_trust_enforced    = yes

[i40e_nic]
device_addr          = 0000:01:00.1
device_driver        = i40e
test_ip_addr         = 192.168.124.40
vf_trust_enforced    = yes

[dual_i40e_nic]
device_addr          = 0000:01:00.0,0000:01:00.1
device_driver        = i40e
test_ip_addr         = 192.168.124.40
vf_trust_enforced    = yes

[cx7_nic]
device_addr          = 0000:b1:00.0
device_driver        = mlx5_core
vf_trust_enforced    = no
aer_inject_supported = yes
switchdev_mode       = no

; GraceHopper H100 GPU (nvidia-grace-hopper-05)
; The device must be bound to pci_pf_stub on the host before running tests;
; virsh nodedev-detach then picks nvgrace_gpu_vfio_pci automatically.
; Host setup (once):
;   modprobe pci_pf_stub
;   echo "10de 2342" > /sys/bus/pci/drivers/pci_pf_stub/new_id
; No SR-IOV (no device_driver), no network test (no test_ip_addr).
[gh100]
device_addr  = 0009:01:00.0

; NVIDIA GPU with SR-IOV vGPU — use with --feature=vgpu
; vgpu_type: numeric ID from /sys/bus/pci/devices/<vf>/nvidia/creatable_vgpu_types
[nvidia_gpu]
device_addr   = 0000:01:00.0
vgpu_type     = 913

[nvme]
device_addr   = 0000:04:00.0

[tower01_gpu]
device_addr   = 0000:01:00.0,0000:01:00.1,0000:01:00.2,0000:01:00.3

[tower01_x550]
device_addr   = 0000:02:00.0
device_driver = ixgbe
test_ip_addr  = 192.168.199.199
