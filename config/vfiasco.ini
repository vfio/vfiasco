; vfiasco.ini - VFIO Automated SR-IOV Conformance Orchestrator configuration
;
; [path]
;   unattended_dir   Directory containing kickstart/unattended files for VM install.
;   domain_xml_dir   Directory containing libvirt XML templates used by tests.
;   utils_dir        Directory of shared utility modules.
;   output_dir       Root for all runtime output (logs, images, dmesg, etc.).
;                    All output_* subdirectories are derived from this single value.
;   qemu_bin         Optional: absolute path to the QEMU binary.  If unset, the
;                    framework probes PATH for qemu-kvm, qemu-system-x86_64, and
;                    qemu-system-aarch64, falling back to /usr/libexec/qemu-kvm.
;
; [logging]
;   console_level    Minimum level printed to stdout: DEBUG | INFO | WARNING | ERROR
;   file_level       Minimum level written to log files (typically DEBUG for full trace).
;
; [nfs]  Required only for VM installation tests (case_install_a_domain).
;   iso_dst          Host path where Windows ISO images are mounted.

[path]
unattended_dir=./unattended
domain_xml_dir=./domain_xml
utils_dir=./utils
output_dir=./output

[logging]
console_level=INFO
file_level=DEBUG
